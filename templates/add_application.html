{% extends "base.html" %}

{% block title %}Add application | Job Application Tracker{% endblock %}

{% block content %}
  <h1>Add application</h1>
  <p class="intro">Enter the details of an application you want to track.</p>

  {% if error %}
    <p class="validation-error" role="alert">{{ error }}</p>
  {% endif %}

  <form method="post" class="application-form">
    <label for="company">Company *</label>
    <input id="company" name="company" value="{{ form_data.get('company', '') }}" required>

    <label for="position">Position *</label>
    <input id="position" name="position" value="{{ form_data.get('position', '') }}" required>

    <label for="location">Location</label>
    <input id="location" name="location" value="{{ form_data.get('location', '') }}">

    <label for="application_date">Application date *</label>
    <input
      id="application_date"
      name="application_date"
      type="date"
      value="{{ form_data.get('application_date', '') }}"
      required
    >

    <label for="job_url">Job URL</label>
    <input id="job_url" name="job_url" type="url" value="{{ form_data.get('job_url', '') }}">

    <label for="status">Status *</label>
    <select id="status" name="status" required>
      {% for status in statuses %}
        <option
          value="{{ status }}"
          {% if form_data.get("status", "Applied") == status %}selected{% endif %}
        >
          {{ status }}
        </option>
      {% endfor %}
    </select>

    <label for="notes">Notes</label>
    <textarea id="notes" name="notes" rows="5">{{ form_data.get('notes', '') }}</textarea>

    <label for="deadline_date">Deadline date</label>
    <input
      id="deadline_date"
      name="deadline_date"
      type="date"
      value="{{ form_data.get('deadline_date', '') }}"
    >

    <label for="deadline_type">Deadline type</label>
    <select id="deadline_type" name="deadline_type">
      <option value="">Not set</option>
      <option value="Test" {% if form_data.get("deadline_type") == "Test" %}selected{% endif %}>
        Test
      </option>
      <option value="Interview" {% if form_data.get("deadline_type") == "Interview" %}selected{% endif %}>
        Interview
      </option>
    </select>

    <div class="form-actions">
      <button type="submit">Save application</button>
      <a href="{{ url_for('index') }}">Cancel</a>
    </div>
  </form>
{% endblock %}
